name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Το functions/api/chat.js (συνομιλία) χρειάζεται το @anthropic-ai/sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Ανεβαίνουν μόνο τα αρχεία της σελίδας (html, css, js, εικόνες στη ρίζα),
      # όχι CLAUDE.md, .claude/, .github/, package.json κ.λπ. Το functions/ το βρίσκει μόνο του το wrangler.
      - name: Collect site files
        run: |
          mkdir dist
          find . -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' \
            -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.svg' -o -iname '*.ico' \
            -o -iname '*.webp' -o -iname '*.gif' \) -exec cp {} dist/ \;
          test -f dist/index.html
          ls -l dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e0a30de04a34897cb089e2d96bc0fa58
          command: pages deploy dist --project-name=portfolio-gkolfos --branch=main --commit-dirty=true
